html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

	display: block;
}

	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;

<script>
// iPhone/iPad als Home-Bildschirm-App: ganzer Bildschirm (auch unter der Statusleiste), Seite darf nicht scrollen.
var ggVp = document.querySelector("meta[name=viewport]");
if (ggVp) { ggVp.setAttribute("content", "width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"); }
// iPhone/iPad: höchstens 2 Bildpunkte je CSS-Pixel rendern statt 3 – spart über die Hälfte Grafikspeicher.
// Safari lädt die Seite neu, wenn ihr der Speicher ausgeht (Meldung 0.29.2: Spiel lädt einfach neu).
(function () { var r = window.devicePixelRatio || 1; if (r > 2 && navigator.maxTouchPoints > 0) { try { Object.defineProperty(window, "devicePixelRatio", { get: function () { return 2; }, configurable: true }); } catch (e) {} } })();
// Sichere Ränder (Kamera-Aussparung) messen; das Spiel liest window.ggSafe und rückt die Seitenleisten ein.
function ggMeasureSafe() {
  var el = document.getElementById("gg-safe");
  if (!el) { el = document.createElement("div"); el.id = "gg-safe"; document.body.appendChild(el); }
  var cs = getComputedStyle(el);
  window.ggSafe = { l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0, t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0, h: window.innerHeight };
}
function ggResize() { window.scrollTo(0, 0); ggMeasureSafe(); window.dispatchEvent(new Event("resize")); }
window.addEventListener("load", function () { ggMeasureSafe(); [200, 600, 1200, 2500].forEach(function (t) { setTimeout(ggResize, t); }); });
window.addEventListener("orientationchange", function () { setTimeout(ggResize, 300); setTimeout(ggResize, 900); });
window.addEventListener("pageshow", function () { setTimeout(ggResize, 300); });
if (window.visualViewport) { window.visualViewport.addEventListener("resize", function () { window.scrollTo(0, 0); ggMeasureSafe(); }); }
// Hintergrundmusik: der Browser streamt music/*.mp3 selbst (zwei Decks zum Überblenden, Lautstärke per Web Audio,
// weil iPhone die Lautstärke von <audio> ignoriert). Start erst nach dem ersten Tippen/Klick (Autoplay-Regel).
window.ggMusic = (function () {
  var ctx = null, decks = [];
  function ensure() {
    if (ctx) { return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (var i = 0; i < 2; i++) {
      var a = new Audio(); a.preload = 'auto';
      var g = ctx.createGain(); g.gain.value = 0;
      ctx.createMediaElementSource(a).connect(g); g.connect(ctx.destination);
      decks.push({ a: a, g: g, want: false });
    }
  }
  function unlock() {
    ensure();
    if (ctx.state !== 'running') { ctx.resume(); }
    decks.forEach(function (d) { if (d.want && d.a.paused) { d.a.play().catch(function () {}); } });
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (e) { document.addEventListener(e, unlock, true); });
  document.addEventListener('visibilitychange', function () {
    if (!ctx) { return; }
    if (document.hidden) { ctx.suspend(); } else { ctx.resume(); }
  });
  return {
    load: function (i, url) { ensure(); decks[i].a.src = url; decks[i].a.load(); },
    play: function (i) { ensure(); var d = decks[i]; d.want = true; d.a.currentTime = 0; d.a.play().catch(function () {}); },
    stop: function (i) { ensure(); decks[i].want = false; decks[i].a.pause(); },
    gain: function (i, v) { ensure(); decks[i].g.gain.value = v; },
    pos: function (i) { ensure(); return decks[i].a.currentTime || 0; },
    dur: function (i) { ensure(); var x = decks[i].a.duration; return isFinite(x) ? x : 0; },
    playing: function (i) { ensure(); var a = decks[i].a; return !a.paused && !a.ended; },
    running: function () { return !!ctx && ctx.state === 'running'; }
  };
})();

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2979612,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
